<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Finder</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Rakkas&family=Abril+Fatface&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand">
                <a href="#" class="logo">شريط</a>
                <nav class="nav-links">
                    <a href="#" class="active" data-type="movie">أفلام</a>
                    <a href="#" data-type="tv">مسلسلات</a>
                    <a href="#" data-type="person">النجوم</a>
                </nav>
            </div>
            <div class="auth">
                <a href="#" class="btn btn-ghost">دخول</a>
                <a href="#" class="btn btn-primary">إنشاء حساب</a>
            </div>
        </header>

        <section class="hero">
            <h1>Welcome.</h1>
            <p>Millions of movies, TV shows and people to discover. Explore now!</p>
            <form class="search-form" id="searchForm">
                <input type="text" id="searchInput" placeholder="Search for a movie...">
                <button type="submit">Search</button>
            </form>
        </section>

        <main class="trending">
            <div class="section-header">
                <h2 id="sectionTitle">Trending</h2>
                <div class="toggle" id="timeToggle">
                    <button class="active" data-time="day">Today</button>
                    <button data-time="week">This Week</button>
                </div>
            </div>
            <div class="movies" id="movies">
            </div>
            <button class="load-more" id="loadMore" hidden>Load more</button>
        </main>
        
        <dialog class="details" id="details">
            <button class="close-details" id="closeDetails">&times;</button>
            <div class="details-content" id="detailsContent"></div>
        </dialog>

        <script src="main.js"></script>
    </body>
</html>
