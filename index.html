<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Finder</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href= "https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <header class="navbar">
            <a href="#" class="logo">Movie Finder</a>
            <nav class="nav-links">
                <div class="nav-item">
                    <a href="#" data-type="movie">Movies</a>
                    <div class="submenu">
                        <a href="#" data-category="popular">Popular</a>
                        <a href="#" data-category="now_playing">Now Playing</a>
                        <a href="#" data-category="upcoming">Upcoming</a>
                        <a href="#" data-category="top_rated">Top Rated</a>
                    </div>
                </div>
                <div class="nav-item">
                    <a href="#" data-type="tv">TV shows</a>
                    <div class="submenu">
                        <a href="#" data-category="popular">Popular</a>
                        <a href="#" data-category="airing_today">Airing Today</a>
                        <a href="#" data-category="on_the_air">On TV</a>
                        <a href="#" data-category="top_rated">Top Rated</a>
                    </div>
                </div>
                <div class="nav-item">
                    <a href="#" data-type="person">People</a>
                </div>
            </nav>
            <button class="nav-search" id="navSearch">&#128269;</button>
        </header>

        <section class="hero">
            <h1>Welcome.</h1>
            <p>Millions of movies, TV shows and people to discover. Explore now!</p>
            <form class="search-form" id="searchForm">
                <input type="text" id="searchInput" placeholder="Search for a movie...">
                <button type="submit">Search</button>
            </form>
        </section>

        <main class="trending">
            <div class="section-header">
                <h2 id="sectionTitle">Trending</h2>
                <div class="toggle" id="timeToggle">
                    <button class="active" data-time="day">Today</button>
                    <button data-time="week">This Week</button>
                </div>
            </div>
            <div class="movies" id="movies">
            </div>
            <button class="load-more" id="loadMore" hidden>Load more</button>
        </main>
        
        <dialog class="details" id="details">
            <button class="close-details" id="closeDetails">&times;</button>
            <div class="details-content" id="detailsContent"></div>
        </dialog>

        <script src="main.js"></script>
    </body>
</html>
