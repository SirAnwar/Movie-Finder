<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>نتائج البحث — شريط</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Rakkas&family=Abril+Fatface&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand">
                <a href="/" class="logo">شريط</a>
                <nav class="nav-links">
                    <a href="/?type=movie" data-type="movie">أفلام</a>
                    <a href="/?type=tv" data-type="tv">مسلسلات</a>
                    <a href="/?type=person" data-type="person">النجوم</a>
                </nav>
            </div>
            <div class="auth">
                <a href="#" class="btn btn-ghost">دخول</a>
                <a href="#" class="btn btn-primary">إنشاء حساب</a>
            </div>
        </header>

        <main class="search-page">
            <form class="search-form" id="searchForm" role="search" action="/pages/search.html">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <label for="searchInput" class="visually-hidden">ابحث عن فيلم أو مسلسل أو شخص</label>
                <input type="text" id="searchInput" name="q" placeholder="ابحث عن فيلم أو مسلسل أو شخص…" required>
                <button type="submit" class="btn btn-primary">بحث</button>
            </form>

            <h1 id="searchTitle">نتائج البحث</h1>
            <p class="results-count" id="resultsCount"></p>

            <div class="movies" id="movies"></div>
            <button class="btn btn-primary load-more" id="loadMore" hidden>عرض المزيد</button>
        </main>

        <dialog class="details" id="details">
            <button class="close-details" id="closeDetails" aria-label="إغلاق">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
            </button>
            <div class="details-content" id="detailsContent"></div>
        </dialog>

        <script type="module" src="/js/search.js"></script>
    </body>
</html>
