# The frontend lives in /client, the Express API will live in /server (deployed on Render)
[build]
  base = "client"
  publish = "."
  functions = "netlify/functions"

# Send API calls to the Express server (local now; Render URL at deploy)
[[redirects]]
  from = "/api/*"
  to = "http://localhost:3000/api/:splat"
  status = 200
  force = true
