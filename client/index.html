<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>شريط</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Rakkas&family=Abril+Fatface&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand">
                <a href="/" class="logo">شريط</a>
                <nav class="nav-links">
                    <details class="nav-menu" id="navMenu">
                        <summary data-type="movie"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 8h20M7 4v4M12 4v4M17 4v4"/></svg><span class="nav-label">أفلام</span></summary>
                        <div class="menu">
                            <a href="/?type=movie">الأفلام الرائجة</a>
                            <a href="/pages/classics.html">الأفلام الكلاسيكية</a>
                        </div>
                    </details>
                    <a href="/?type=tv" data-type="tv"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg><span class="nav-label">مسلسلات</span></a>
                    <a href="/?type=person" data-type="person"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg><span class="nav-label">النجوم</span></a>
                    <a href="#" class="nav-favorites"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.4 2.4 5 6 5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.6 0 5.4 3.4 4 6.7-2.5 4.7-10 9.3-10 9.3z"/></svg><span class="nav-label">المفضلة</span></a>
                </nav>
            </div>
            <div class="auth">
                <a href="#" class="btn btn-ghost">دخول</a>
                <a href="#" class="btn btn-primary">إنشاء حساب</a>
            </div>
        </header>

        <section class="hero">
            <h1>اعثر على فيلمك <span>المفضّل</span> القادم</h1>
            <div class="divider divider-short" aria-hidden="true"><span></span></div>
            <p>ملايين الأفلام والمسلسلات والنجوم — ابحث، واحفظ، وتابع ما تحب.</p>
            <form class="search-form" id="searchForm" role="search" action="/pages/search.html">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <label for="searchInput" class="visually-hidden">ابحث عن فيلم أو مسلسل أو شخص</label>
                <input type="text" id="searchInput" name="q" placeholder="ابحث عن فيلم أو مسلسل أو شخص…" required>
                <button type="submit" class="btn btn-primary">بحث</button>
            </form>
        </section>

        <div class="film-strip" aria-hidden="true"></div>

        <main class="trending">
            <div class="section-header">
                <h2 id="sectionTitle">الرائج</h2>
                <div class="toggle" id="timeToggle">
                    <button class="active" data-time="day">اليوم</button>
                    <button data-time="week">هذا الأسبوع</button>
                </div>
            </div>
            <div class="divider" aria-hidden="true"><span></span></div>
            <div class="movies" id="movies">
            </div>
            <button class="btn btn-primary load-more" id="loadMore" hidden>عرض المزيد</button>
        </main>
        
        <dialog class="details" id="details">
            <button class="close-details" id="closeDetails" aria-label="إغلاق">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
            </button>
            <div class="details-content" id="detailsContent"></div>
        </dialog>

        <script type="module" src="/js/home.js"></script>
    </body>
</html>
