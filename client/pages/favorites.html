<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>المفضّلة — شريط</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Rakkas&family=Abril+Fatface&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand">
                <a href="/" class="logo">شريط</a>
                <nav class="nav-links">
                    <details class="nav-menu" id="navMenu">
                        <summary data-type="movie"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 8h20M7 4v4M12 4v4M17 4v4"/></svg><span class="nav-label">أفلام</span></summary>
                        <div class="menu">
                            <a href="/?type=movie">الأفلام الرائجة</a>
                            <a href="/pages/classics.html">الأفلام الكلاسيكية</a>
                        </div>
                    </details>
                    <a href="/?type=tv" data-type="tv"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg><span class="nav-label">مسلسلات</span></a>
                    <a href="/?type=person" data-type="person"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg><span class="nav-label">النجوم</span></a>
                    <a href="/pages/favorites.html" class="nav-favorites active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.4 2.4 5 6 5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.6 0 5.4 3.4 4 6.7-2.5 4.7-10 9.3-10 9.3z"/></svg><span class="nav-label">المفضّلة</span></a>
                </nav>
            </div>
            <div class="auth">
                <a href="/pages/login.html" class="btn btn-ghost">دخول</a>
                <a href="/pages/signup.html" class="btn btn-primary">إنشاء حساب</a>
            </div>
        </header>

        <main class="favorites-page">
            <section class="favorites-intro">
                <h1>المفضّلة</h1>
                <p id="favoritesCount"></p>
            </section>

            <div class="film-strip" aria-hidden="true"></div>

            <section class="favorites-list">
                <div class="movies" id="favorites"></div>

                <div class="empty-state" id="emptyBox" hidden>
                    <div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.4 2.4 5 6 5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.6 0 5.4 3.4 4 6.7-2.5 4.7-10 9.3-10 9.3z"/></svg></div>
                    <h2>لم تُضِف أي فيلم إلى المفضّلة بعد</h2>
                    <p>اضغط على أيقونة القلب في أي فيلم لحفظه هنا.</p>
                    <a href="/" class="btn btn-primary">تصفّح الأفلام</a>
                </div>

                <div class="empty-state" id="guestBox" hidden>
                    <div class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.4 2.4 5 6 5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.6 0 5.4 3.4 4 6.7-2.5 4.7-10 9.3-10 9.3z"/></svg></div>
                    <h2>سجّل دخولك لتشاهد مفضّلتك</h2>
                    <p>احفظ أفلامك ومسلسلاتك المفضّلة، واعثر عليها من أي جهاز.</p>
                    <div class="empty-actions">
                        <a href="/pages/login.html" class="btn btn-primary">تسجيل الدخول</a>
                        <a href="/pages/signup.html" class="btn btn-ghost">إنشاء حساب</a>
                    </div>
                </div>
            </section>
        </main>

        <dialog class="details" id="details">
            <button class="close-details" id="closeDetails" aria-label="إغلاق">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
            </button>
            <div class="details-content" id="detailsContent"></div>
        </dialog>

        <script type="module" src="/js/favorites-page.js"></script>
    </body>
</html>
