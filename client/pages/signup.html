<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>إنشاء حساب — شريط</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Rakkas&family=Abril+Fatface&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <header class="navbar">
            <div class="brand">
                <a href="/" class="logo">شريط</a>
                <nav class="nav-links">
                    <details class="nav-menu" id="navMenu">
                        <summary data-type="movie"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 8h20M7 4v4M12 4v4M17 4v4"/></svg><span class="nav-label">أفلام</span></summary>
                        <div class="menu">
                            <a href="/?type=movie">الأفلام الرائجة</a>
                            <a href="/pages/classics.html">الأفلام الكلاسيكية</a>
                        </div>
                    </details>
                    <a href="/?type=tv" data-type="tv"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 3l4 3 4-3"/></svg><span class="nav-label">مسلسلات</span></a>
                    <a href="/?type=person" data-type="person"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg><span class="nav-label">النجوم</span></a>
                    <a href="#" class="nav-favorites"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.6 8.4 2.4 5 6 5c2 0 3.4 1 4 2.2.6-1.2 2-2.2 4-2.2 3.6 0 5.4 3.4 4 6.7-2.5 4.7-10 9.3-10 9.3z"/></svg><span class="nav-label">المفضلة</span></a>
                </nav>
            </div>
            <div class="auth">
                <a href="#" class="btn btn-ghost">دخول</a>
                <a href="#" class="btn btn-primary">إنشاء حساب</a>
            </div>
        </header>

        <main class="auth-page">
            <section class="auth-card auth-card-wide">
                <h1>إنشاء حساب جديد</h1>
                <div class="divider" aria-hidden="true"><span></span></div>
                <p class="auth-subtitle">احفظ أفلامك ومسلسلاتك المفضّلة، واعثر عليها من أي جهاز.</p>

                <form class="auth-form" id="signupForm">
                    <div class="field">
                        <label for="name">الاسم الكامل</label>
                        <input type="text" id="name" name="name" placeholder="مثال: أنور" autocomplete="name" maxlength="50" required>
                    </div>

                    <div class="field">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" dir="ltr" autocomplete="email" required>
                    </div>

                    <div class="field">
                        <label for="password">كلمة المرور</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required>
                    </div>

                    <label class="terms">
                        <input type="checkbox" name="terms" required>
                        <span>أوافق على <a href="/pages/terms.html">شروط الاستخدام</a> و<a href="/pages/privacy.html">سياسة الخصوصية</a>.</span>
                    </label>

                    <p class="form-error" id="formError" role="alert" hidden></p>
                    <button type="submit" class="btn btn-primary">إنشاء حساب</button>
                    <p class="form-note">بعد إنشاء الحساب، سيتم تسجيل دخولك مباشرةً دون الحاجة لخطوة إضافية.</p>
                </form>

                <p class="auth-or"><span>أو</span></p>
                <p class="auth-switch">لديك حساب بالفعل؟ <a href="/pages/login.html">تسجيل الدخول</a></p>
            </section>
        </main>

        <script type="module" src="/js/signup.js"></script>
    </body>
</html>
